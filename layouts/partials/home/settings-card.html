<md-elevated-card id="settings-card" style="padding:16px; display:none;" hidden>
  <div slot="headline" class="md-typescale-title-large" style="display:flex; align-items:center; gap:8px;">
    <md-icon>settings</md-icon>
    <span data-i18n="settings.title">設定</span>
  </div>

  <div style="margin-top:16px; border-top:1px solid var(--md-sys-color-outline); padding-top:16px;">
    <md-list style="background:transparent; padding:0;">
      <md-list-item>
        <md-icon slot="start">language</md-icon>
        <div slot="headline" data-i18n="settings.language">言語</div>
        <div slot="supporting-text" data-i18n="settings.languageDescription">表示言語を設定します。</div>
        <md-outlined-select
          id="localeSelect"
          slot="end"
          style="min-width:160px;"
          data-i18n-label="settings.language"
          data-i18n-supporting-text="settings.languageDescription"
          hasLeadingIcon>
          <md-icon slot="start">language</md-icon>
          <md-select-option value="ja">
            <div slot="headline" data-i18n="settings.languageJa">日本語</div>
          </md-select-option>
          <md-select-option value="en">
            <div slot="headline" data-i18n="settings.languageEn">English</div>
          </md-select-option>
        </md-outlined-select>
      </md-list-item>

      <md-divider style="margin: 8px 0;"></md-divider>

      <md-list-item>
        <md-icon slot="start">delete_outline</md-icon>
        <div slot="headline" data-i18n="settings.clearCache">キャッシュをクリア</div>
        <div slot="supporting-text" data-i18n="settings.cacheDescription">ブラウザにキャッシュされたデータをクリアします。</div>
        <md-filled-tonal-button id="clearCacheBtn" slot="end">
          <md-icon slot="icon">delete</md-icon>
          <span data-i18n="settings.clearCacheAction">クリア</span>
        </md-filled-tonal-button>
      </md-list-item>

      <md-divider style="margin: 8px 0;"></md-divider>

      <md-list-item>
        <md-icon slot="start">cookie</md-icon>
        <div slot="headline" data-i18n="settings.clearCookies">Cookie をクリア</div>
        <div slot="supporting-text" data-i18n="settings.cookiesDescription">ログイン情報を含むすべての Cookie を削除し、強制的にログアウトします。</div>
        <md-filled-button id="clearCookiesBtn" slot="end" style="--md-filled-button-container-color: var(--md-sys-color-error, #ba1a1a); --md-filled-button-label-text-color: var(--md-sys-color-on-error, #ffffff);">
          <md-icon slot="icon">delete_forever</md-icon>
          <span data-i18n="settings.clearCookiesAction">クリア</span>
        </md-filled-button>
      </md-list-item>
    </md-list>
  </div>
</md-elevated-card>
