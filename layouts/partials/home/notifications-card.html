<md-elevated-card id="notifications-card" class="component-card notifications-card" hidden>
  <div class="notifications-topbar">
    <div class="md-typescale-title-large notifications-header">
      <span data-i18n="notifications.title">通知</span>
    </div>
    <md-icon-button id="notificationsSettingsBtn" aria-label="通知設定" title="通知設定">
      <md-icon>settings</md-icon>
    </md-icon-button>
  </div>

  <div class="notifications-tabs" role="tablist" aria-label="通知の種類">
    <button class="notifications-tab is-active" type="button" role="tab" aria-selected="true" data-notification-tab="all">全部</button>
    <button class="notifications-tab" type="button" role="tab" aria-selected="false" data-notification-tab="mentions">提及</button>
  </div>

  <div id="notificationsActions" class="action-row notifications-actions" hidden>
    <md-filled-tonal-button id="notificationsRefreshBtn">
      <md-icon slot="icon">refresh</md-icon>
      <span data-i18n="notifications.refresh">更新</span>
    </md-filled-tonal-button>
    <md-outlined-button id="notificationsSeenBtn">
      <md-icon slot="icon">done_all</md-icon>
      <span data-i18n="notifications.markAsSeen">すべて既読にする</span>
    </md-outlined-button>
  </div>

  <div id="notifications" class="notifications-list notifications-content"></div>

  <script type="module" src="/src/notifications-preview.js"></script>
</md-elevated-card>
