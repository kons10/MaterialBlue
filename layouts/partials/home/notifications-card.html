<md-elevated-card id="notifications-card" class="component-card notifications-card" hidden>
  <div slot="headline" class="md-typescale-title-large notifications-header">
    <md-icon>notifications</md-icon>
    <span data-i18n="notifications.title">通知</span>
  </div>

  <div class="action-row notifications-actions">
    <md-filled-tonal-button id="notificationsRefreshBtn">
      <md-icon slot="icon">refresh</md-icon>
      <span data-i18n="notifications.refresh">更新</span>
    </md-filled-tonal-button>
    <md-outlined-button id="notificationsSeenBtn">
      <md-icon slot="icon">done_all</md-icon>
      <span data-i18n="notifications.markAsSeen">既読にする</span>
    </md-outlined-button>
  </div>

  <div id="notifications" class="notifications-list notifications-content"></div>

  <script type="module" src="/src/notifications-preview.js"></script>
</md-elevated-card>
