name: "OpenRouter AI Code Scan"

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '45 15 * * 4'

concurrency:
  group: ai-scan-main
  cancel-in-progress: true

jobs:
  ai-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run OpenRouter AI Scanner
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node .github/scripts/ai-scan.mjs

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ai-results.sarif
          category: openrouter-ai-scan
